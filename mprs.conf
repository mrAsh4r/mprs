[GENERAL]
# Основные настройки MPRS
interface = eth0
log_level = INFO
max_log_size = 100MB

[CAPTURE]
# Настройки захвата пакетов
bpf_filter = tcp or udp or icmp
promisc_mode = true
snaplen = 1500

[BLOCKING]
# Настройки блокировки
soft_block_duration = 300    # 5 минут
hard_block_duration = 3600   # 1 час
max_concurrent_blocks = 1000
whitelist_file = /etc/mprs/whitelist.txt

[TELEGRAM]
# Настройки Telegram уведомлений
enabled = false
bot_token = YOUR_BOT_TOKEN
chat_id = YOUR_CHAT_ID
rate_limit = 10              # максимум сообщений в минуту

[WEB]
# Настройки веб-интерфейса
enabled = true
host = 0.0.0.0
port = 8080
debug = false

[LOGGING]
# Настройки логирования
events_file = /var/log/mprs/events.json
blocked_ips_file = /var/log/mprs/blocked_ips.json
rotate_size = 50MB
rotate_count = 5
